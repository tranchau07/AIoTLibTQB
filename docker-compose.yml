x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:

  mongodb:
    image: mongo:8.0
    container_name: aiot_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-CHANGE_ME_LOCAL_DEV_MONGO}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-aiot_identity_db}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - aiot_db_net
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-express:
    image: mongo-express:1.0.2
    container_name: aiot_mongo_express
    profiles: ["dev", "debug"]
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME:-root}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-CHANGE_ME_LOCAL_DEV_MONGO}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-CHANGE_ME_LOCAL_DEV_MONGO}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_BASICAUTH_PASSWORD:-CHANGE_ME_LOCAL_DEV_ME}
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - aiot_db_net
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8081 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: aiot_mosquitto
    restart: unless-stopped
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        PASSWD_FILE="/mosquitto/data/password.txt"
        ACL_FILE="/mosquitto/data/acl.conf"
        mkdir -p /mosquitto/data /mosquitto/log
        : > "$$PASSWD_FILE"
        cp /mosquitto/config/acl.conf "$$ACL_FILE"
        chmod 0700 "$$PASSWD_FILE" "$$ACL_FILE"
        mosquitto_passwd -b "$$PASSWD_FILE" "$${MQTT_USERNAME:-aiot_backend}" "$${MQTT_PASSWORD:-CHANGE_ME_LOCAL_DEV_MQTT}"
        mosquitto_passwd -b "$$PASSWD_FILE" "$${MQTT_ADMIN_USERNAME:-admin}" "$${MQTT_ADMIN_PASSWORD:-CHANGE_ME_LOCAL_DEV_ADMIN}"
        DEV_PASS="$${MQTT_DEVICE_PASSWORD:-$${MQTT_PASSWORD:-CHANGE_ME_LOCAL_DEV_MQTT}}"
        for DEV_ID in ESP32S3_ZONE_A_001 ESP32_ROOM_101 ESP32_ROOM_101_CTR ESP32_ROOM_101_DOOR ESP32_ROOM_102 ESP32_ROOM_102_B ESP32_ROOM_102_C ESP32_STORAGE_201 ESP32_STORAGE_201_B ESP32_STORAGE_201_C ESP32_HALL_001_A ESP32_HALL_001_B ESP32_HALL_001_C; do
          mosquitto_passwd -b "$$PASSWD_FILE" "$$DEV_ID" "$$DEV_PASS"
        done
        chown -R mosquitto:mosquitto /mosquitto/data /mosquitto/log 2>/dev/null || true
        chmod 0700 "$$PASSWD_FILE" "$$ACL_FILE"
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-aiot_backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-CHANGE_ME_LOCAL_DEV_MQTT}
      MQTT_ADMIN_USERNAME: ${MQTT_ADMIN_USERNAME:-admin}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:-CHANGE_ME_LOCAL_DEV_ADMIN}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD:-CHANGE_ME_LOCAL_DEV_DEVICE}
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/acl.conf:/mosquitto/config/acl.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - aiot_app_net
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$${MQTT_USERNAME:-aiot_backend}\" -P \"$${MQTT_PASSWORD:-CHANGE_ME_LOCAL_DEV_MQTT}\" -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiot_backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      - MONGO_URI=mongodb://${MONGO_ROOT_USERNAME:-root}:${MONGO_ROOT_PASSWORD:-CHANGE_ME_LOCAL_DEV_MONGO}@mongodb:27017/${MONGO_DATABASE:-aiot_identity_db}?authSource=admin
      - JWT_SECRET=${JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - MQTT_BROKER_URL=tcp://mosquitto:1883
      - MQTT_CLIENT_ID=aiot_backend_consumer
      - MQTT_USERNAME=${MQTT_USERNAME:-aiot_backend}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-CHANGE_ME_LOCAL_DEV_MQTT}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - INITIAL_ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-CHANGE_ME_LOCAL_DEV_ADMIN}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - aiot_db_net
      - aiot_app_net
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1024M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8080/ws-aiot}
    container_name: aiot_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - PORT=3000
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - aiot_app_net
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  simulator:
    build:
      context: ./tools/iot-simulator
      dockerfile: Dockerfile
    container_name: aiot_simulator
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - MQTT_PER_DEVICE_AUTH=${MQTT_PER_DEVICE_AUTH:-true}
      - MQTT_DEVICE_PASSWORD=${MQTT_DEVICE_PASSWORD:-CHANGE_ME_LOCAL_DEV_DEVICE}
      - API_BASE_URL=http://backend:8080
      - ADMIN_USERNAME=${MQTT_ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${INITIAL_ADMIN_PASSWORD:-CHANGE_ME_LOCAL_DEV_ADMIN}
      - DEFAULT_SCENARIO=${DEFAULT_SCENARIO:-demo}
      - SIM_INTERVAL_MS=${SIM_INTERVAL_MS:-5000}
      - SIM_SPEED=${SIM_SPEED:-1}
      - FORCE_REMOTE=${FORCE_REMOTE:-true}
    networks:
      - aiot_app_net
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

volumes:
  mongo_data:
    name: aiot_mongo_data
  mosquitto_data:
    name: aiot_mosquitto_data
  mosquitto_log:
    name: aiot_mosquitto_log

networks:
  aiot_db_net:
    name: aiot_db_net
    driver: bridge
  aiot_app_net:
    name: aiot_app_net
    driver: bridge
