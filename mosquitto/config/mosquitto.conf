listener 1883 0.0.0.0
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Cấu hình bảo mật xác thực (Authentication)
# Sử dụng password_file cho các tài khoản thiết bị và admin được cấp phép
password_file /mosquitto/config/password.txt
acl_file /mosquitto/config/acl.conf
allow_anonymous false
