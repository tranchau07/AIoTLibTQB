listener 1883 0.0.0.0
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# DoS & Resource Exhaustion Protections (MQTT-03)
max_packet_size 65536
max_connections 200
max_inflight_messages 20
max_queued_messages 1000
max_keepalive 300

# Authentication & Per-Device ACL Authorization
password_file /mosquitto/data/password.txt
acl_file /mosquitto/data/acl.conf
allow_anonymous false
