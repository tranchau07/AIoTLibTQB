# Mosquitto ACL Configuration for AIoTLibTQB (Least Privilege Policy)

# Backend consumer/publisher service: read telemetry/status, write device commands, read broker health
user aiot_backend
topic read devices/+/telemetry
topic read devices/+/status
topic write devices/+/command
topic read $SYS/#

# Broker administrator account
user admin
topic readwrite #
topic read $SYS/#

# IoT devices: isolated strictly to their own hardwareId (%u) topics
pattern write devices/%u/telemetry
pattern write devices/%u/status
pattern read devices/%u/command
